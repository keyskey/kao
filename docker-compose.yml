services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kao
      POSTGRES_PASSWORD: kao
      POSTGRES_DB: kao
    volumes:
      - kao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kao -d kao"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  kao_pgdata:
